commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    biome:
      priority: 2
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
