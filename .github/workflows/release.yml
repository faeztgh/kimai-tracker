# Fully automatic versioning + multi-platform/arch releases.
#
# On every push to main:
#   1. `version` derives the next SemVer from Conventional Commits
#      (fix: -> patch, feat: -> minor, `feat!:` / "BREAKING CHANGE" -> MAJOR),
#      creates the vX.Y.Z git tag, and emits release notes.
#   2. `build` (matrix: Windows / macOS / Linux) builds installers for x64 AND
#      arm64 and publishes them to the GitHub Release for that tag. Those assets
#      double as the electron-updater feed.
#
# If a push contains no version-worthy commits, `default_bump: patch` still cuts
# a patch release. Set `default_bump: false` to release only on feat/fix/breaking.
# Use the manual "Run workflow" button to force a release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

  build:
    needs: version
    if: needs.version.outputs.new_version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run dist
