appId: pro.faez.kimaitracker
productName: Kimai Tracker
copyright: Copyright © 2026 faeztgh

directories:
  buildResources: build
  output: release/${version}

# Only the built output + manifest ship in the app; src/ and electron/ source
# are excluded automatically by this whitelist.
# resources/** must ship inside the app AND be unpacked from the asar:
# electron-vite compiles `?asset` imports from resources/ to
# join(__dirname, "../../resources/..."), which resolves to app.asar/resources/...
# at runtime — asarUnpack redirects that to a real file on disk.
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.{map,md,ts}"

asarUnpack:
  - resources/**

# Runtime icons (tray + window) — copied to <app>/resources/resources at runtime
# (see electron/main/resources.ts).
extraResources:
  - from: resources
    to: resources
    filter: ["**/*"]

asar: true
compression: maximum

electronLanguages:
  - en-US
  - en-GB
  - fa
  - de
  - es
  - ar
  - ru
  - fr
  - it
  - pt-BR
  - pt-PT
  - nl
  - pl
  - tr
  - ja
  - zh-CN
  - uk
  - cs
  - ko

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Kimai Tracker
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  # Hardened runtime / notarization require an Apple Developer ID — wire up later.

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  icon: build/icon.png
  category: Utility
  maintainer: faeztgh <faeztgh@users.noreply.github.com>
  synopsis: Time-tracking widget for self-hosted Kimai

# Auto-update feed (electron-updater). Change owner/repo to your GitHub repo.
# releaseType: release => assets publish to a public release (so the updater sees them).
publish:
  provider: github
  owner: faeztgh
  repo: kimai-tracker
  releaseType: release
